<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cumberland Live Incidents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: dispatch board — status strip, map left, incident log right; stacks map-over-log on phones */
:root{
  --bg:#eef1f4; --panel:#ffffff; --line:#d5dbe2; --ink:#14202b; --muted:#5d6b78;
  --ems:#c2282f; --fire:#d4691a; --law:#2459b8; --traffic:#7b3fb5; --other:#6b7480;
  --new:#f2c230; --ok:#1f8a4c; --warn:#b98a00;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17202a; --line:#2a3642; --ink:#e4eaf0; --muted:#8d9aa7;
  --ems:#f0565c; --fire:#f08a3e; --law:#5b8ef0; --traffic:#a97ae6; --other:#97a1ad; --new:#f2c230; --ok:#44c07a; --warn:#e2b82e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17202a; --line:#2a3642; --ink:#e4eaf0; --muted:#8d9aa7;
  --ems:#f0565c; --fire:#f08a3e; --law:#5b8ef0; --traffic:#a97ae6; --other:#97a1ad; --new:#f2c230; --ok:#44c07a; --warn:#e2b82e;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-display);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--law);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-size:19px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.count{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer}
.count b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.count span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.count[data-t="EMS"]{border-left:4px solid var(--ems)}
.count[data-t="Fire"]{border-left:4px solid var(--fire)}
.count[data-t="Law"]{border-left:4px solid var(--law)}
.count[data-t="Traffic"]{border-left:4px solid var(--traffic)}
.count[aria-pressed="false"]{opacity:.4}
.status{display:flex;align-items:center;gap:10px;font:12px var(--f-mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.dot.err{background:var(--ems);animation:none}
.dot.paused{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:13px}
.iconbtn[aria-pressed="true"]{border-color:var(--ink)}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
main>*{min-width:0}
#map{min-height:300px;background:var(--bg)}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.filters{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters input,.filters select{min-width:0;max-width:100%;flex:1 1 0;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
#list{flex:1;overflow-y:auto;min-height:0}
.inc{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.inc:hover,.inc.sel{background:var(--bg)}
.inc .stripe{grid-row:1/span 3;background:var(--other)}
.inc[data-t="EMS"] .stripe{background:var(--ems)} .inc[data-t="Fire"] .stripe{background:var(--fire)} .inc[data-t="Law"] .stripe{background:var(--law)} .inc[data-t="Traffic"] .stripe{background:var(--traffic)}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:6px;vertical-align:-3px;color:#fff;background:var(--other)}
.ico svg{width:12px;height:12px;fill:currentColor}
.ico.EMS{background:var(--ems)} .ico.Fire{background:var(--fire)} .ico.Law{background:var(--law)} .ico.Traffic{background:var(--traffic)}
.inc h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.inc .age{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.inc .loc{grid-column:2/span 2;color:var(--ink);font-size:14px}
.inc .meta{grid-column:2/span 2;font:12px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.badge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--new);color:#2a2000;font:600 10px var(--f-mono);vertical-align:2px;letter-spacing:.05em}
.inc.fresh{animation:flash 2.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--new) 45%,transparent)}to{background:transparent}}
.detail{padding:4px 0 2px;grid-column:2/span 2;font-size:13px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0}
.detail dt{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;padding-top:2px}
.detail dd{margin:0;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.detail a{color:var(--law);margin-right:14px;font-weight:600}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:10px 12px;font:14px/1.35 var(--f-display);max-height:46vh;overflow-y:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop + .pop{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.pop-h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.pop-h b{font-size:15px;margin-right:8px}
.pop-age{font:12px var(--f-mono);color:var(--muted)}
.pop-loc{font-size:13px;margin-top:2px}
.pop .detail{padding:0}
.views{display:none}
.detail .onmap{display:none;color:var(--law);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-size:13px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.cond{display:flex;flex-direction:column;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.alert{--sev:var(--warn);border:1px solid color-mix(in srgb,var(--sev) 45%,var(--line));border-left:5px solid var(--sev);background:color-mix(in srgb,var(--sev) 10%,var(--panel));padding:7px 10px;border-radius:4px;cursor:pointer;text-align:left;width:100%}
.alert.sev-Extreme,.alert.sev-Severe{--sev:var(--ems)} .alert.sev-Moderate{--sev:var(--fire)}
.alert b{font-size:15px} .alert .when{font:12px var(--f-mono);color:var(--muted);margin-left:8px}
.alert .hl{display:block;font-size:13px;margin-top:2px}
.alert p{margin:8px 0 0;white-space:pre-wrap;font-size:13px;line-height:1.45;max-width:75ch}
.alert a{color:var(--law);font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.gauge,.wx{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:inherit;text-decoration:none;min-width:0}
.gauge .nm,.wx .nm{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.gauge .v{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.gauge .tr{font-weight:400;color:var(--muted)}
.gauge .nm{overflow:hidden;text-overflow:ellipsis}
.wx .v{font-size:13px;font-weight:600;color:var(--ok)} .wx.err .v{color:var(--muted)}
.pill{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font:600 10px/16px var(--f-mono);letter-spacing:.04em;vertical-align:1px;color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.pill.action{color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.pill.minor,.pill.moderate,.pill.major{color:#fff;background:var(--ems)}
.today{padding:14px 16px 20px;display:flex;flex-direction:column;gap:18px}
.today h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kpi{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);border-top:3px solid var(--ink)}
.kpi b{display:block;font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi.EMS{border-top-color:var(--ems)} .kpi.Fire{border-top-color:var(--fire)} .kpi.Law{border-top-color:var(--law)} .kpi.Traffic{border-top-color:var(--traffic)}
.hours svg{width:100%;height:auto;display:block}
.hours .bar{fill:color-mix(in srgb,var(--ink) 30%,transparent)} .hours .bar.now{fill:var(--law)}
.hours .grid{stroke:var(--line);stroke-width:1} .hours text{fill:var(--muted);font:10px var(--f-mono)}
.rank{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 2.5em;gap:5px 8px;align-items:center;font-size:13px}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .track{height:8px;border-radius:4px;background:var(--bg)} .rank .fill{height:100%;border-radius:4px;background:var(--muted)}
.rank .n{font:600 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
footer{padding:6px 16px;font:11px var(--f-mono);color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}

.mk{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--other);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);transition:transform .15s}
.mk svg{width:16px;height:16px;fill:currentColor}
.mk.EMS{background:var(--ems)} .mk.Fire{background:var(--fire)} .mk.Law{background:var(--law)} .mk.Traffic{background:var(--traffic)}
.mk.isnew{outline:3px solid var(--new);outline-offset:1px}
.mk.sel{transform:scale(1.3)}
.mk .n{position:absolute;top:-7px;right:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--panel);font:600 10px/17px var(--f-mono);text-align:center}
.leaflet-container{font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}

@media (max-width:820px){
  .tabs button{padding:8px 4px;letter-spacing:.04em}
  .cond{padding-block:6px}
  /* Phones: scroll the whole page instead of squeezing the list into leftover height */
  html,body{height:auto}
  body{display:block;min-height:100%}
  main{display:block}
  #map{height:calc(100dvh - 210px);min-height:320px}
  aside{border-left:0;min-height:50vh}
  body.v-list #map{display:none}
  body.v-map aside{display:none}
  .views{display:flex;gap:4px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:600}
  .views button{flex:1;padding:7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-weight:600;font-size:14px;cursor:pointer}
  .views button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  .tabs{top:calc(env(safe-area-inset-top,0px) + 45px)}
  /* One swipeable row of conditions instead of a tall grid */
  .gauges{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gauges::-webkit-scrollbar{display:none}
  .gauge,.wx{flex:0 0 auto;min-width:118px}
  .gauge .nm{overflow:visible}
  .detail .onmap{display:inline}
  #list{overflow:visible;flex:none}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:500;background:var(--panel)}
  .status .clock{display:none}
}
@media (prefers-reduced-motion:reduce){.dot,.inc.fresh{animation:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Cumberland County Incidents</b><span>Live from county 911 dispatch</span></div>
  <div class="counts" id="counts">
    <button class="count" data-t="EMS" aria-pressed="true"><b id="cEMS">–</b><span>EMS</span></button>
    <button class="count" data-t="Fire" aria-pressed="true"><b id="cFire">–</b><span>Fire</span></button>
    <button class="count" data-t="Law" aria-pressed="true"><b id="cLaw">–</b><span>Police</span></button>
    <button class="count" data-t="Traffic" aria-pressed="true"><b id="cTraffic">–</b><span>Traffic</span></button>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting…</span>
    <span class="clock" id="clock"></span>
    <button class="iconbtn" id="sound" aria-pressed="false" title="Chime on new incidents">Chime off</button>
  </div>
</header>
<section class="cond" aria-label="Current conditions">
  <div id="alerts"></div>
  <div class="gauges" id="gauges"><span class="wx"><span class="nm">Weather</span><span class="v">Checking…</span></span></div>
</section>
<div class="views" role="tablist" aria-label="View">
  <button id="viewList" role="tab" aria-selected="true">List</button>
  <button id="viewMap" role="tab" aria-selected="false">Map</button>
</div>
<main>
  <div id="map" role="region" aria-label="Incident map"></div>
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="Search street, unit, call type">
      <select id="muni" aria-label="Municipality"><option value="">All municipalities</option></select>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabActive" aria-selected="true">Active <span id="nActive"></span></button>
      <button role="tab" id="tabCleared" aria-selected="false">Cleared <span id="nCleared"></span></button>
      <button role="tab" id="tabToday" aria-selected="false">Today <span id="nToday"></span></button>
    </div>
    <div id="list"><div class="empty">Loading incidents…</div></div>
  </aside>
</main>
<footer>Sources: Cumberland County DPS incident feed (every 30 s), National Weather Service alerts, USGS stream gauges. Not for emergency use; call 911.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FEED = "https://services1.arcgis.com/1Cfo0re3un0w6a30/arcgis/rest/services/Active_Incidents_Public/FeatureServer/0/query"
  + "?where=1%3D1&outFields=*&returnGeometry=false&orderByFields=EventDateTime%20DESC&f=json";
const POLL_MS = 30000;
const $ = id => document.getElementById(id);

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

let active = new Map();          // CaseNumber -> incident
let seen = new Set(store.get("seen", []));
let cleared = store.get("cleared", []).filter(c => new Date(c.clearedAt).toDateString() === new Date().toDateString());
let fresh = new Set();           // arrived during this session
let firstLoad = true, tab = "active", selected = null, timer = null;
let show = {EMS:true, Fire:true, Law:true, Traffic:true};
let chime = store.get("chime", false);

// ---- map
const map = L.map("map", {zoomControl:true}).setView([40.2, -77.15], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const markers = new Map();

const TRAFFIC_RE = /ACCIDENT|TRAFFIC|CRASH|COLLISION|VEHICLE|MVA|HIT AND RUN|ROADWAY/i;
function typeOf(r){
  if (TRAFFIC_RE.test(r.Incident || "")) return "Traffic";
  return ["EMS","Fire","Law"].includes(r.EventType) ? r.EventType : "other";
}
const ICONS = {
  EMS: '<path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/>',
  Fire: '<path d="M12 1.5c1.2 3.8 5.5 6.2 5.5 11.8a5.5 5.5 0 0 1-11 0c0-2.8 1.4-4.8 2.8-6.1.2 2 1.1 3.3 2.4 3.9C11 8 11.2 4.6 12 1.5z"/>',
  Law: '<path d="M12 1.5l8.5 3.2v6.2c0 5.3-3.6 9.9-8.5 11.6-4.9-1.7-8.5-6.3-8.5-11.6V4.7zm0 5l-1.4 2.9-3.2.4 2.3 2.2-.6 3.1 2.9-1.5 2.9 1.5-.6-3.1 2.3-2.2-3.2-.4z" fill-rule="evenodd"/>',
  Traffic: '<path fill-rule="evenodd" d="M4.8 10.5l1.7-4.6A2.2 2.2 0 0 1 8.6 4.4h6.8a2.2 2.2 0 0 1 2.1 1.5l1.7 4.6A2.2 2.2 0 0 1 21 12.7V18h-2.2v2h-3v-2H8.2v2h-3v-2H3v-5.3a2.2 2.2 0 0 1 1.8-2.2zm2.3-.2h9.8l-1.2-3.4a.9.9 0 0 0-.8-.6H9.1a.9.9 0 0 0-.8.6zM6.6 15.6a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zm10.8 0a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z"/>',
  other: '<circle cx="12" cy="12" r="5"/>'
};
const svg = t => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[t] || ICONS.other}</svg>`;
const PRIORITY = ["Traffic","Fire","EMS","Law","other"];
const TZ = "America/New_York";
function clock(ms, secs){ return new Date(ms).toLocaleTimeString("en-US", {timeZone:TZ, hour:"numeric", minute:"2-digit", second: secs ? "2-digit" : undefined, hour12:true}) }
// The feed stores Eastern wall-clock time labeled as UTC; convert it to a true timestamp
function wallAsUTC(ms){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {timeZone:TZ, hourCycle:"h23", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"})
    .formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
}
function evt(r){
  if (r._t) return r._t;
  const raw = r.EventDateTime, guess = raw + (raw - wallAsUTC(raw));
  return r._t = guess + (raw - wallAsUTC(guess));
}
function stamp(ms){
  const d = new Date(ms), today = new Date().toLocaleDateString("en-US", {timeZone:TZ}) === d.toLocaleDateString("en-US", {timeZone:TZ});
  return (today ? "" : d.toLocaleDateString("en-US", {timeZone:TZ, month:"short", day:"numeric"}) + ", ") + clock(ms);
}
function clean(s){ return (s||"").replace(/\s+/g," ").trim() }
function esc(s){ return clean(String(s ?? "")).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
function ago(ms){
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 60) return m + "m";
  const h = Math.floor(m/60); return h < 48 ? h + "h " + (m%60) + "m" : Math.floor(h/24) + "d";
}
function where(r){
  const st = clean(r.StreetName), x = clean(r.CrossStreets).replace(/^&$/,"");
  return st ? (x ? `${st} near ${x}` : st) : (x || "Location withheld");
}

// ---- data
async function poll(){
  try{
    const res = await fetch(FEED, {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    if (j.error) throw new Error(j.error.message || "Feed error");
    ingest(j.features.map(f => f.attributes));
    setStatus("ok", "Updated " + clock(Date.now(), true));
  }catch(e){
    setStatus("err", "Feed unreachable, retrying");
  }
}

function ingest(rows){
  const next = new Map();
  let arrivals = 0;
  rollDay();
  for (const r of rows){
    next.set(r.CaseNumber, r);
    if (dayKey(evt(r)) === day.date && !day.calls[r.CaseNumber])
      day.calls[r.CaseNumber] = [evt(r), typeOf(r), clean(r.Municipality), clean(r.Incident)];
    if (!seen.has(r.CaseNumber)){
      seen.add(r.CaseNumber);
      if (!firstLoad){ fresh.add(r.CaseNumber); arrivals++; }
    }
  }
  for (const [id, r] of active){
    if (!next.has(id)){
      cleared.unshift({...r, clearedAt: Date.now()});
      fresh.delete(id);
    }
  }
  cleared = cleared.slice(0, 200);
  active = next;
  firstLoad = false;
  store.set("seen", [...seen].slice(-1500));
  store.set("cleared", cleared);
  store.set("day", day);
  if (arrivals && chime) beep();
  refreshMuni();
  render();
}

function setStatus(kind, text){
  $("dot").className = "dot" + (kind === "err" ? " err" : kind === "paused" ? " paused" : "");
  $("statusText").textContent = text;
}

// ---- filters
function refreshMuni(){
  const sel = $("muni"), cur = sel.value;
  const set = new Set([...active.values(), ...cleared].map(r => clean(r.Municipality)).filter(Boolean));
  const opts = [...set].sort();
  sel.innerHTML = '<option value="">All municipalities</option>' + opts.map(m => `<option${m===cur?" selected":""}>${esc(m)}</option>`).join("");
}
function passes(r){
  const t = typeOf(r);
  if (t !== "other" && !show[t]) return false;
  const m = $("muni").value; if (m && clean(r.Municipality) !== m) return false;
  const q = $("q").value.trim().toLowerCase();
  if (q){
    const hay = [r.Incident, r.StreetName, r.CrossStreets, r.Municipality, r.unid, r.UnitDesc, r.StationName, r.CaseNumber].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

// ---- render
function render(){
  const all = [...active.values()];
  for (const t of ["EMS","Fire","Law","Traffic"]) $("c"+t).textContent = all.filter(r => typeOf(r) === t).length;
  $("nActive").textContent = "(" + all.length + ")";
  $("nCleared").textContent = "(" + cleared.length + ")";
  $("nToday").textContent = "(" + Object.keys(day.calls).length + ")";
  if (tab === "today"){ renderToday(); drawMarkers(all.filter(passes)); return; }

  const rows = (tab === "active" ? all : cleared).filter(passes);
  const list = $("list");
  if (!rows.length){
    list.innerHTML = `<div class="empty">${tab === "active" ? "No active incidents match these filters." : "Nothing has cleared since this page opened today."}</div>`;
  } else {
    list.innerHTML = rows.map(r => {
      const isNew = tab === "active" && fresh.has(r.CaseNumber);
      const sel = selected === r.CaseNumber;
      const age = tab === "active" ? ago(evt(r)) : "ran " + ago(evt(r) - (Date.now() - r.clearedAt));
      return `<div class="inc${sel?" sel":""}${isNew?" fresh":""}" data-t="${typeOf(r)}" data-id="${esc(r.CaseNumber)}" tabindex="0">
        <div class="stripe"></div>
        <h3><span class="ico ${typeOf(r)}">${svg(typeOf(r))}</span>${esc(r.Incident)}${isNew ? '<span class="badge">NEW</span>' : ""}</h3>
        <div class="age">${age}</div>
        <div class="loc">${esc(where(r))} · <b>${esc(r.Municipality)}</b></div>
        <div class="meta"><span>${stamp(evt(r))}</span><span>${esc(r.unid)}</span></div>
        ${sel ? detail(r) : ""}
      </div>`;
    }).join("");
  }
  drawMarkers(tab === "active" ? rows : []);
}

function detail(r){ return `<div class="detail">${detailBody(r)} ${onMapBtn(r)}</div>`; }
function detailBody(r){
  return `<dl>
    <dt>Case</dt><dd>${esc(r.CaseNumber)}</dd>
    <dt>Units</dt><dd>${esc(r.unid)} (${esc(r.UnitDesc)})</dd>
    <dt>Agency</dt><dd>${esc(r.StationName)}</dd>
    <dt>Box</dt><dd>${esc(r.BoxNumber)}</dd>
    ${r.clearedAt ? `<dt>Cleared</dt><dd>${stamp(r.clearedAt)}</dd>` : ""}
  </dl>
  <a href="https://webcad.cumberlandcountypa.gov/WebCAd_Detail.aspx?@search=${encodeURIComponent(r.CaseNumber)}" target="_blank" rel="noopener">WebCAD details</a>
  <a href="https://www.google.com/maps?q=${r.latitude},${r.longitude}" target="_blank" rel="noopener">Directions</a>`;
}
function onMapBtn(r){ return `<button class="onmap" data-map="${esc(r.CaseNumber)}">Show on map</button>`;
}
function popupHtml(g){
  return g.map(r => `<div class="pop"><div class="pop-h"><span class="ico ${typeOf(r)}">${svg(typeOf(r))}</span><b>${esc(r.Incident)}</b><span class="pop-age">${stamp(evt(r))} · ${ago(evt(r))} ago</span></div>
    <div class="pop-loc">${esc(where(r))} · ${esc(r.Municipality)}</div>
    <div class="detail">${detailBody(r)}</div></div>`).join("");
}
const canHover = matchMedia("(hover:hover)").matches;

function drawMarkers(rows){
  // One marker per location: a crash often has separate fire, EMS and police cases at the same spot
  const groups = new Map();
  for (const r of rows){
    if (!r.latitude || !r.longitude) continue;
    const key = r.latitude.toFixed(4) + "," + r.longitude.toFixed(4);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  for (const [key, g] of groups){
    g.sort((a, b) => PRIORITY.indexOf(typeOf(a)) - PRIORITY.indexOf(typeOf(b)) || evt(b) - evt(a));
    const lead = g[0], t = typeOf(lead);
    const isNew = g.some(r => fresh.has(r.CaseNumber));
    const isSel = g.some(r => r.CaseNumber === selected);
    const html = `<div class="mk ${t}${isNew ? " isnew" : ""}${isSel ? " sel" : ""}">${svg(t)}${g.length > 1 ? `<span class="n">${g.length}</span>` : ""}</div>`;
    const icon = L.divIcon({className:"", html, iconSize:[30,30], iconAnchor:[15,15], tooltipAnchor:[0,-16]});
    let m = markers.get(key);
    if (!m){
      m = L.marker([lead.latitude, lead.longitude], {icon, riseOnHover:true}).addTo(map);
      m.bindPopup("", {maxWidth:300, minWidth:220, autoPanPadding:[16,16]});
      m.on("click", () => { m.setPopupContent(popupHtml(m._group)); select(m._lead, false, true); });
      markers.set(key, m);
    } else m.setIcon(icon);
    m._lead = lead.CaseNumber; m._group = g;
    if (m.isPopupOpen()) m.setPopupContent(popupHtml(g));
    m.setZIndexOffset(isNew || isSel ? 1000 : 0);
    if (canHover) m.bindTooltip(g.map(r => `<b>${esc(r.Incident)}</b> · ${ago(evt(r))} ago`).join("<br>")
      + `<br>${esc(where(lead))}<br>${esc(lead.Municipality)}`, {direction:"top"});
  }
  for (const [key, m] of markers) if (!groups.has(key)){ map.removeLayer(m); markers.delete(key); }
}

function select(id, fly, keep){
  selected = keep ? id : (selected === id ? null : id);
  fresh.delete(id);
  const r = active.get(id) || cleared.find(c => c.CaseNumber === id);
  if (selected && r && r.latitude && fly) map.flyTo([r.latitude, r.longitude], 14, {duration:.6});
  if (!selected) map.closePopup();
  render();
  if (selected && fly){
    const m = [...markers.values()].find(m => m._group && m._group.some(x => x.CaseNumber === id));
    if (m) map.once("moveend", () => { m.setPopupContent(popupHtml(m._group)); m.openPopup(); });
  }
  const el = document.querySelector(`.inc[data-id="${CSS.escape(id)}"]`);
  if (el && !fly && matchMedia("(min-width:821px)").matches) el.scrollIntoView({block:"nearest"});
}

// ---- today's tally (kept in this browser only)
function dayKey(ms){ return new Date(ms).toLocaleDateString("en-US", {timeZone:TZ}) }
function hourOf(ms){ return +new Intl.DateTimeFormat("en-US", {timeZone:TZ, hour:"numeric", hourCycle:"h23"}).format(new Date(ms)) % 24 }
let day = store.get("day", null);
function rollDay(){
  const k = dayKey(Date.now());
  if (!day || day.date !== k || typeof day.calls !== "object") day = {date:k, since:Date.now(), calls:{}};
}
rollDay();

function rankRows(pairs, color){
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return `<div class="rank">${pairs.map(([nm, n]) => `<span class="nm">${esc(nm)}</span><span class="track"><span class="fill" style="display:block;width:${(n/max*100).toFixed(1)}%;${color ? `background:var(--${color(nm)})` : ""}"></span></span><span class="n">${n}</span>`).join("")}</div>`;
}
function renderToday(){
  const calls = Object.values(day.calls);
  const by = (i) => { const m = new Map(); for (const c of calls) m.set(c[i], (m.get(c[i]) || 0) + 1); return [...m].sort((a,b) => b[1] - a[1]); };
  const count = t => calls.filter(c => c[1] === t).length;
  const hours = Array(24).fill(0); for (const c of calls) hours[hourOf(c[0])]++;
  const nowH = hourOf(Date.now()), max = Math.max(1, ...hours);
  const W = 360, H = 110, top = 14, base = 92, bw = 11, step = (W - 16) / 24;
  const bars = hours.map((n, h) => {
    const bh = n / max * (base - top), x = 8 + h * step + (step - bw) / 2;
    return `<rect class="bar${h === nowH ? " now" : ""}" x="${x.toFixed(1)}" y="${(base - bh).toFixed(1)}" width="${bw}" height="${Math.max(n ? 1.5 : 0, bh).toFixed(1)}" rx="1.5"><title>${h % 12 || 12}${h < 12 ? "a" : "p"}: ${n} calls</title></rect>`;
  }).join("");
  const ticks = [[0,"12a"],[6,"6a"],[12,"12p"],[18,"6p"],[23,"11p"]].map(([h, l]) =>
    `<text x="${(8 + h * step + step / 2).toFixed(1)}" y="${base + 14}" text-anchor="middle">${l}</text>`).join("");
  const typeColor = { EMS:"ems", Fire:"fire", Law:"law", Traffic:"traffic", other:"other" };
  const label = { EMS:"EMS", Fire:"Fire", Law:"Police", Traffic:"Traffic", other:"Other" };
  $("list").innerHTML = calls.length ? `<div class="today">
    <div class="kpis">
      <div class="kpi"><b>${calls.length}</b><span>Calls</span></div>
      ${["EMS","Fire","Law","Traffic"].map(t => `<div class="kpi ${t}"><b>${count(t)}</b><span>${label[t]}</span></div>`).join("")}
    </div>
    <div class="hours"><h4>Calls by hour</h4>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls by hour today">
        <line class="grid" x1="8" x2="${W - 8}" y1="${base}" y2="${base}"/>
        <line class="grid" x1="8" x2="${W - 8}" y1="${top}" y2="${top}" stroke-dasharray="2 3"/>
        <text x="8" y="${top - 4}">${max} max</text>
        ${bars}${ticks}
      </svg></div>
    <div><h4>Busiest municipalities</h4>${rankRows(by(2).slice(0, 8))}</div>
    <div><h4>Most common calls</h4>${rankRows(by(3).slice(0, 8))}</div>
    <div><h4>By type</h4>${rankRows(by(1).map(([t, n]) => [label[t] || t, n]), nm => typeColor[Object.keys(label).find(k => label[k] === nm)] || "other")}</div>
    <p class="note">Counted in this browser from calls seen since ${clock(day.since)}. Calls that started and cleared while the page was closed aren't included. Resets at midnight.</p>
  </div>` : `<div class="empty">No calls counted yet today. Calls are tallied as this page sees them.</div>`;
}

// ---- weather alerts (National Weather Service), filtered to Cumberland County (SAME code 042041)
let openAlert = null;
async function pollWeather(){
  const box = $("alerts");
  try{
    const res = await fetch("https://api.weather.gov/alerts/active?area=PA", {headers:{Accept:"application/geo+json"}, cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    const rank = {Extreme:0, Severe:1, Moderate:2, Minor:3, Unknown:4};
    const alerts = (j.features || []).map(f => f.properties)
      .filter(p => (p.geocode?.SAME || []).includes("042041") && p.status === "Actual")
      .sort((a, b) => (rank[a.severity] ?? 4) - (rank[b.severity] ?? 4));
    box.innerHTML = alerts.map(p => {
      const open = openAlert === p.id;
      const until = p.ends || p.expires;
      return `<button class="alert sev-${esc(p.severity)}" data-id="${esc(p.id)}" aria-expanded="${open}">
        <b>${esc(p.event)}</b>${until ? `<span class="when">until ${stamp(Date.parse(until))}</span>` : ""}
        <span class="hl">${esc(p.headline || "")}</span>
        ${open ? `<p>${esc(p.description || "").replace(/&lt;br&gt;/g,"")}${p.instruction ? "\n\n" + esc(p.instruction) : ""}</p>
        <p><a href="https://forecast.weather.gov/MapClick.php?lat=40.2&lon=-77.15" target="_blank" rel="noopener">NWS forecast for Cumberland County</a></p>` : ""}
      </button>`;
    }).join("");
    box.hidden = !alerts.length;
    setWx(alerts.length ? null : "No weather alerts");
  }catch(e){ box.hidden = true; setWx("Alerts unavailable", true); }
}
function setWx(text, err){
  let el = document.querySelector(".gauges .wx");
  if (!text){ el && el.remove(); return; }
  if (!el){ el = document.createElement("a"); $("gauges").prepend(el); }
  el.outerHTML = `<a class="wx${err ? " err" : ""}" href="https://forecast.weather.gov/MapClick.php?lat=40.2&lon=-77.15" target="_blank" rel="noopener"><span class="nm">Weather</span><span class="v">${text}</span></a>`;
}
$("alerts").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const b = e.target.closest(".alert"); if (!b) return;
  openAlert = openAlert === b.dataset.id ? null : b.dataset.id; pollWeather();
});

// ---- stream gauges: live stage from USGS, flood stages from NWS (ft)
const GAUGES = [
  {usgs:"01570500", lid:"HARP1", name:"Susquehanna", place:"Harrisburg", flood:{action:11, minor:17, moderate:20, major:23}},
  {usgs:"01570000", lid:"HGSP1", name:"Conodoguinet", place:"Hogestown", flood:{action:6, minor:8, moderate:10, major:12}},
  {usgs:"01571500", lid:"CPHP1", name:"Yellow Breeches", place:"Camp Hill", flood:{action:6, minor:7, moderate:9, major:13}},
];
async function pollGauges(){
  try{
    const res = await fetch(`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${GAUGES.map(g => g.usgs).join(",")}&parameterCd=00065&period=PT4H&siteStatus=active`, {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    const series = Object.fromEntries((j.value?.timeSeries || []).map(t => [t.sourceInfo.siteCode[0].value, (t.values[0]?.value || []).filter(v => +v.value > -999)]));
    const html = GAUGES.map(g => {
      const v = series[g.usgs] || [];
      const link = `https://water.noaa.gov/gauges/${g.lid}`;
      if (!v.length) return `<a class="gauge" href="${link}" target="_blank" rel="noopener"><span class="nm">${g.name}</span><span class="v">No reading</span></a>`;
      const last = +v[v.length - 1].value, first = +v[0].value, d = last - first;
      const [arrow, trend] = d > 0.1 ? ["▲","rising"] : d < -0.1 ? ["▼","falling"] : ["–","steady"];
      const f = g.flood;
      const [cls, lbl] = last >= f.major ? ["major","MAJOR FLOOD"] : last >= f.moderate ? ["moderate","MOD FLOOD"] : last >= f.minor ? ["minor","FLOOD"] : last >= f.action ? ["action","ACTION"] : ["ok","NORMAL"];
      return `<a class="gauge" href="${link}" target="_blank" rel="noopener" title="${g.name} at ${g.place}: ${trend}, flood stage ${f.minor} ft, reading ${stamp(Date.parse(v[v.length - 1].dateTime))}">
        <span class="nm">${g.name}</span>
        <span class="v">${last.toFixed(1)} ft <span class="tr" aria-label="${trend}">${arrow}</span><span class="pill ${cls}">${lbl}</span></span></a>`;
    }).join("");
    document.querySelectorAll(".gauges .gauge").forEach(el => el.remove());
    $("gauges").insertAdjacentHTML("beforeend", html);
  }catch(e){
    if (!document.querySelector(".gauges .gauge")) $("gauges").insertAdjacentHTML("beforeend", `<span class="gauge"><span class="nm">Stream gauges</span><span class="v">Unavailable</span></span>`);
  }
}

// ---- chime
let actx;
function beep(){
  try{
    actx = actx || new AudioContext();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(880, actx.currentTime); o.frequency.setValueAtTime(660, actx.currentTime + .15);
    g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .4);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .4);
  }catch(e){}
}
function paintChime(){ $("sound").setAttribute("aria-pressed", chime); $("sound").textContent = chime ? "Chime on" : "Chime off"; }

// ---- events
const isPhone = () => matchMedia("(max-width:820px)").matches;
function setView(v){
  document.body.classList.toggle("v-list", v === "list");
  document.body.classList.toggle("v-map", v === "map");
  $("viewList").setAttribute("aria-selected", v === "list");
  $("viewMap").setAttribute("aria-selected", v === "map");
  if (v === "map") setTimeout(() => map.invalidateSize(), 0);
}
$("viewList").onclick = () => setView("list");
$("viewMap").onclick = () => setView("map");
setView("list");
$("list").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const b = e.target.closest("[data-map]");
  if (b){ setView("map"); setTimeout(() => { selected = null; select(b.dataset.map, true); }, 50); return; }
  const el = e.target.closest(".inc"); if (el) select(el.dataset.id, !isPhone());
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter"){ const el = e.target.closest(".inc"); if (el) select(el.dataset.id, true); } });
$("q").addEventListener("input", render);
$("muni").addEventListener("change", render);
document.querySelectorAll(".count").forEach(b => b.addEventListener("click", () => {
  const t = b.dataset.t; show[t] = !show[t]; b.setAttribute("aria-pressed", show[t]); render();
}));
for (const [id, name] of [["tabActive","active"],["tabCleared","cleared"],["tabToday","today"]])
  $(id).onclick = () => { tab = name; for (const b of ["tabActive","tabCleared","tabToday"]) $(b).setAttribute("aria-selected", b === id); $("list").scrollTop = 0; render(); };
$("sound").onclick = () => { chime = !chime; store.set("chime", chime); paintChime(); if (chime) beep(); };

let wxTimer, gTimer;
function start(){
  clearInterval(timer); clearInterval(wxTimer); clearInterval(gTimer);
  poll(); pollWeather(); pollGauges();
  timer = setInterval(poll, POLL_MS); wxTimer = setInterval(pollWeather, 120000); gTimer = setInterval(pollGauges, 300000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ clearInterval(timer); clearInterval(wxTimer); clearInterval(gTimer); setStatus("paused", "Paused while hidden"); } else start();
});
setInterval(() => { $("clock").textContent = clock(Date.now()); if (active.size) render(); }, 60000);
$("clock").textContent = clock(Date.now());
paintChime();
start();
</script>
</body>
